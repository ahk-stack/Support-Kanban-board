<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=q-logo-tab-v3" />
  <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=q-logo-tab-v3" />
  <title>Quinta Support Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caladea:wght@700&family=Inter:wght@400;500;600;700&display=swap');
    /* Same chrome as the board: the brand's black warmed towards violet, with
       the accent gradient kept for the one action on the page. */
    :root{--ink:#0d0f20;--text:#13152c;--muted:#5a6082;--border:#cdd1e6;--primary:#5b4cf5;--grad:linear-gradient(135deg,#6d5efc 0%,#a855f7 62%,#ec4899 130%)}
    *{box-sizing:border-box}
    body{font-family:Inter,'Segoe UI',Arial,sans-serif;margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;color:var(--text);-webkit-font-smoothing:antialiased;
      background:radial-gradient(700px 420px at 12% 8%,rgba(124,92,255,.45),transparent 70%),radial-gradient(600px 400px at 92% 96%,rgba(236,72,153,.28),transparent 70%),linear-gradient(180deg,#1a1d38,var(--ink))}
    .brand{display:flex;align-items:center;gap:12px;color:#fff}
    .brand-mark{width:40px;height:40px;border-radius:12px;background:#fff;color:#000;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 10px 30px rgba(124,92,255,.5)}
    .brand-name{font-family:Caladea,Georgia,serif;font-weight:700;font-size:26px;letter-spacing:-.01em;line-height:1}
    .brand-tag{display:block;font-family:Inter,'Segoe UI',sans-serif;font-size:12px;font-weight:500;color:rgba(255,255,255,.55);margin-top:5px;letter-spacing:.02em}
    .card{background:#fff;padding:30px 30px 26px;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);width:min(400px,100%);animation:rise .3s cubic-bezier(.2,.9,.3,1.1)}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    h1{margin:0 0 6px;font-family:Caladea,Georgia,serif;font-size:24px;font-weight:700;color:var(--text)}
    p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
    label{display:block;font-size:12.5px;color:#353a5c;font-weight:600;margin-bottom:6px}
    input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:11px;margin-bottom:14px;font:inherit;font-size:15px;color:var(--text);background:#fff;transition:border-color .15s,box-shadow .15s}
    input:hover{border-color:#b4abfb}
    input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,76,245,.22)}
    button{width:100%;padding:12px;border:none;border-radius:11px;background:var(--grad);color:#fff;font:inherit;font-size:15px;font-weight:650;cursor:pointer;box-shadow:0 8px 22px rgba(109,94,252,.35),inset 0 1px 0 rgba(255,255,255,.22);transition:filter .15s,transform .15s}
    button:hover{filter:brightness(1.07);transform:translateY(-1px)}
    button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(91,76,245,.35)}
    button:disabled{opacity:.65;cursor:not-allowed;transform:none;filter:none}
    .link-btn{border:0;background:transparent;color:var(--primary);width:auto;padding:0;font-size:13px;font-weight:600;box-shadow:none}
    .link-btn:hover{transform:none;filter:none;text-decoration:underline}
    .row{display:flex;justify-content:flex-end;margin:-6px 0 18px}
    .err,.msg{margin-top:12px;font-size:13px;min-height:16px}
    .err{color:#dc2626}
    .msg{color:var(--muted)}
    .msg.ok{color:#16a34a}
    .msg.err{color:#dc2626}
    .hidden{display:none}
    @media (prefers-reduced-motion:reduce){.card{animation:none}}
  </style>
</head>
<body>
  <div class="brand" aria-hidden="true"><span class="brand-mark">Q</span><span><span class="brand-name">Support Kanban</span><span class="brand-tag">The Quintessence of Data</span></span></div>
  <form class="card" id="login-form">
    <h1>Sign in</h1>
    <p>Sign in to access the secure board.</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <div class="row"><button class="link-btn" type="button" id="show-forgot">Forgot password?</button></div>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <form class="card hidden" id="forgot-form">
    <h1>Forgot password</h1>
    <p>Enter your account email. If it exists, we will send you a password reset link.</p>
    <label for="reset-email">Email</label>
    <input id="reset-email" name="email" type="email" autocomplete="email" required />
    <button id="forgot-submit" type="submit">Send reset email</button>
    <div class="msg" id="forgot-msg"></div>
    <div class="row" style="justify-content:flex-start;margin:14px 0 0"><button class="link-btn" type="button" id="back-login">Back to sign in</button></div>
  </form>
  <script>
    const loginForm = document.getElementById('login-form');
    const forgotForm = document.getElementById('forgot-form');
    const forgotMsg = document.getElementById('forgot-msg');
    document.getElementById('show-forgot').addEventListener('click', () => {
      loginForm.classList.add('hidden');
      forgotForm.classList.remove('hidden');
      forgotMsg.textContent = '';
      forgotMsg.className = 'msg';
    });
    document.getElementById('back-login').addEventListener('click', () => {
      forgotForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        credentials: 'include',
        body: JSON.stringify({ username, password })
      });
      if (res.ok) {
        // Only ever honor a same-origin redirect back into the OAuth
        // authorize flow - anything else falls back to '/' so this can't be
        // abused as an open redirect via a crafted ?next= link.
        const next = new URLSearchParams(location.search).get('next');
        location.href = (next && next.startsWith('/oauth/authorize')) ? next : '/';
        return;
      }
      document.getElementById('err').textContent = 'Invalid credentials.';
    });

    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();
      const btn = document.getElementById('forgot-submit');
      forgotMsg.textContent = '';
      forgotMsg.className = 'msg';
      btn.disabled = true;
      try {
        const res = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          credentials: 'include',
          body: JSON.stringify({ email })
        });
        const out = await res.json().catch(() => ({}));
        if (res.ok) {
          forgotMsg.textContent = 'Reset email sent. Check your inbox.';
          forgotMsg.className = 'msg ok';
        } else if (out.error === 'email_not_found') {
          forgotMsg.textContent = 'No active user exists with that email.';
          forgotMsg.className = 'msg err';
        } else if (out.error === 'send_email_failed') {
          forgotMsg.textContent = out.sendVia === 'flow'
            ? 'Could not send the email. Ask an admin to check the mail flow.'
            : 'Could not send email. Ask an admin to reconnect Microsoft 365.';
          forgotMsg.className = 'msg err';
          // The real reason, for whoever is helping them - it never fits in the
          // line above and it is what makes the difference between a guess and
          // a fix.
          if (out.detail) console.warn('[forgot-password]', out.detail);
        } else {
          forgotMsg.textContent = 'Unable to send reset email.';
          forgotMsg.className = 'msg err';
        }
      } catch (_) {
        forgotMsg.textContent = 'Network error. Please try again.';
        forgotMsg.className = 'msg err';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
