<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=q-logo-tab-v3" />
  <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=q-logo-tab-v3" />
  <title>Ticket Audit · Support Kanban</title>
  <script>
    // Same theme rule as the board, applied before the first paint.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved === 'dark' || saved === 'light' ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (_) {}
    })();
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caladea:wght@700&family=Inter:wght@400;500;600;700;800;900&display=swap');

    /* The board's own tokens, so this page reads as part of it. */
    :root {
      color-scheme: light;
      --bg: #f3f4fb; --bg-soft: #eceefa; --surface: #ffffff; --surface-soft: #f8f9fe; --surface-muted: #f1f2fa;
      --text: #13152c; --text-soft: #353a5c; --muted: #565c80; --muted-light: #737a9c;
      --border: #e3e5f2; --border-strong: #cdd1e6;
      --primary: #5b4cf5; --primary-dark: #4636d9; --primary-soft: #efedff;
      --accent-a: #6d5efc; --accent-b: #a855f7; --accent-c: #ec4899;
      --accent-grad: linear-gradient(135deg, var(--accent-a) 0%, var(--accent-b) 62%, var(--accent-c) 130%);
      --accent-glow: 0 8px 22px rgba(109, 94, 252, .32);
      --focus-ring: 0 0 0 3px rgba(91, 76, 245, .22);
      --st-new: #7c5cff; --st-inp: #f59e0b; --st-wus: #3b82f6; --st-dft: #06b6d4; --st-wct: #ec4899; --st-res: #10b981;
      --ag-0: #6d28d9; --ag-1: #1d4ed8; --ag-2: #047857; --ag-3: #b45309; --ag-4: #be185d; --ag-5: #0e7490; --ag-6: #7c3aed; --ag-7: #15803d;
      --ag-8: #c2410c; --ag-9: #1e40af; --ag-10: #7e22ce; --ag-11: #0369a1; --ag-12: #9333ea; --ag-13: #15803d; --ag-14: #b91c1c; --ag-15: #0891b2;
      --ag-16: #4f46e5; --ag-17: #dc2626; --ag-18: #059669; --ag-19: #d97706; --ag-20: #7c3aed; --ag-21: #0f766e;
      --success: #16a34a; --success-soft: #dcfce7; --warning: #d97706; --warning-soft: #fef3c7;
      --danger: #dc2626; --danger-soft: #fee2e2; --info: #2563eb; --info-soft: #dbeafe; --purple: #7c3aed; --purple-soft: #ede9fe;
      --shadow-xs: 0 1px 2px rgba(25, 22, 70, 0.06);
      --shadow-sm: 0 1px 2px rgba(25, 22, 70, 0.04), 0 4px 14px rgba(25, 22, 70, 0.06);
      --shadow: 0 2px 6px rgba(25, 22, 70, 0.05), 0 14px 34px rgba(25, 22, 70, 0.11);
      --shadow-lg: 0 24px 70px rgba(18, 14, 60, 0.22);
      --k-created: var(--st-new); --k-stage: var(--primary); --k-assign: #2563eb; --k-cs: #db2777; --k-priority: #d97706;
      --k-category: #0891b2; --k-note: #7c3aed; --k-reply: #059669; --k-jira: #1d4ed8; --k-link: #475569; --k-sla: #ea580c;
      --k-snooze: #6366f1; --k-archive: #64748b; --k-resolution: #10b981; --k-reopen: #dc2626; --k-duplicate: #a855f7;
      --k-sync: #94a3b8; --k-other: #94a3b8;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #090a16; --bg-soft: #0e1022; --surface: #161931; --surface-soft: #121429; --surface-muted: #0d0f20;
      --text: #eef0ff; --text-soft: #c9cce8; --muted: #a0a5c8; --muted-light: #8287ab;
      --border: #272b4b; --border-strong: #383d66;
      --primary: #8d82ff; --primary-dark: #b3abff; --primary-soft: #262158;
      --focus-ring: 0 0 0 3px rgba(141, 130, 255, .32); --accent-glow: 0 8px 24px rgba(109, 94, 252, .38);
      --st-new: #9a80ff; --st-inp: #fbbf24; --st-wus: #60a5fa; --st-dft: #22d3ee; --st-wct: #f472b6; --st-res: #34d399;
      --success: #4ade80; --success-soft: #0f2a1d; --warning: #fbbf24; --warning-soft: #33250b;
      --danger: #f87171; --danger-soft: #3a1620; --info: #60a5fa; --info-soft: #142449; --purple: #a78bfa; --purple-soft: #2a1f57;
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35), 0 6px 16px rgba(0, 0, 0, 0.35);
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 16px 38px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 24px 70px rgba(0, 0, 0, 0.6);
      --k-assign: #60a5fa; --k-cs: #f472b6; --k-priority: #fbbf24; --k-category: #22d3ee; --k-note: #a78bfa; --k-reply: #34d399;
      --k-jira: #93c5fd; --k-link: #94a3b8; --k-sla: #fb923c; --k-snooze: #818cf8; --k-archive: #94a3b8; --k-resolution: #34d399;
      --k-reopen: #f87171; --k-duplicate: #c084fc; --k-sync: #6c7197; --k-other: #6c7197;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      background-image: radial-gradient(1200px 500px at 10% -10%, color-mix(in srgb, var(--accent-a) 9%, transparent), transparent 60%),
                        radial-gradient(900px 420px at 100% 0%, color-mix(in srgb, var(--accent-c) 6%, transparent), transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; color: inherit; }
    a { color: var(--primary); }

    /* ---- Header ------------------------------------------------------------ */
    .app-header {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; gap: 14px;
      padding: 12px clamp(12px, 2vw, 26px);
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--text); }
    .brand-mark { width: 34px; height: 34px; border-radius: 11px; background: var(--accent-grad); box-shadow: var(--accent-glow); display: grid; place-items: center; color: #fff; }
    .brand-title { font-family: Caladea, Inter, sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
    .brand-sub { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 3px; }
    .header-spacer { flex: 1; }
    .tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-muted); border: 1px solid var(--border); border-radius: 12px; }
    .tab { border: 0; background: transparent; padding: 7px 13px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { background: var(--accent-grad); color: #fff; box-shadow: var(--accent-glow); }
    .btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); font-weight: 650; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); color: var(--text); }
    .btn:focus-visible, .tab:focus-visible, .chip-btn:focus-visible, .a-card:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .btn.primary { background: var(--accent-grad); border: 0; color: #fff; box-shadow: var(--accent-glow); }
    .btn.icon { width: 34px; padding: 0; justify-content: center; }
    .btn svg, .tab svg { width: 15px; height: 15px; }

    main { padding: 16px clamp(12px, 2vw, 26px) 40px; }

    /* ---- Filters ------------------------------------------------------------ */
    .filters {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
      padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-xs);
    }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field > span { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-light); }
    .input, .select {
      height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-soft); color: var(--text); font-size: 13px; min-width: 0;
    }
    .input:focus, .select:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
    .search-wrap { position: relative; flex: 1 1 260px; }
    .search-wrap .input { width: 100%; padding-left: 32px; }
    .search-wrap svg { position: absolute; left: 10px; bottom: 9px; width: 15px; height: 15px; color: var(--muted-light); pointer-events: none; }
    .kbd { font-size: 10.5px; font-weight: 700; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--border-strong); color: var(--muted-light); background: var(--surface-muted); }
    .search-wrap .kbd { position: absolute; right: 8px; bottom: 8px; }
    .kind-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip-btn {
      --k: var(--k-other);
      display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; cursor: pointer;
      border: 1px solid color-mix(in srgb, var(--k) 30%, var(--border)); background: var(--surface); color: var(--text-soft); font-size: 12px; font-weight: 650;
    }
    .chip-btn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
    .chip-btn[aria-pressed="true"] { background: color-mix(in srgb, var(--k) 16%, var(--surface)); border-color: color-mix(in srgb, var(--k) 60%, transparent); color: var(--text); }
    .chip-btn .n { font-variant-numeric: tabular-nums; color: var(--muted-light); font-weight: 700; }
    .toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text-soft); height: 34px; cursor: pointer; user-select: none; }
    .toggle input { accent-color: var(--primary); width: 15px; height: 15px; }

    /* ---- Stats strip ---------------------------------------------------------- */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
    .stat {
      position: relative; overflow: hidden; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-xs);
    }
    .stat::after { content: ""; position: absolute; inset: auto -20px -30px auto; width: 90px; height: 90px; border-radius: 50%; background: color-mix(in srgb, var(--tone, var(--primary)) 10%, transparent); pointer-events: none; }
    .stat-label { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-light); }
    .stat-value { font-size: 25px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .stat-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .stat.wide { grid-column: span 2; }
    .spark { display: flex; align-items: flex-end; gap: 2px; height: 40px; margin-top: 8px; }
    .spark i { flex: 1; min-width: 2px; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, var(--accent-b), var(--accent-a)); opacity: .85; }
    .spark i:hover { opacity: 1; }
    .dwell-row { display: grid; grid-template-columns: 120px 1fr 64px; align-items: center; gap: 8px; font-size: 12px; margin-top: 5px; }
    .dwell-row b { font-weight: 650; color: var(--text-soft); display: flex; gap: 6px; align-items: center; }
    .dwell-bar { height: 7px; border-radius: 99px; background: var(--surface-muted); overflow: hidden; }
    .dwell-bar i { display: block; height: 100%; border-radius: 99px; background: var(--stage); }
    .dwell-row em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .actor-stack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .actor-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 2px; border-radius: 999px; background: var(--surface-muted); border: 1px solid var(--border); font-size: 11.5px; font-weight: 700; cursor: pointer; }
    .actor-pill .n { color: var(--muted-light); font-variant-numeric: tabular-nums; }

    .notice { padding: 10px 14px; border-radius: 12px; background: var(--info-soft); color: var(--text-soft); font-size: 12.5px; margin-bottom: 12px; border: 1px solid color-mix(in srgb, var(--info) 25%, transparent); }
    .error { padding: 16px; border-radius: 14px; background: var(--danger-soft); color: var(--danger); font-weight: 600; }

    /* ---- Board view: the kanban, column for column ---------------------------- */
    .board { display: grid; grid-template-columns: repeat(6, minmax(260px, 1fr)); gap: 12px; overflow-x: auto; padding: 2px 0 8px; align-items: start; }
    .col-new { --stage: var(--st-new); } .col-inp { --stage: var(--st-inp); } .col-wus { --stage: var(--st-wus); }
    .col-dft { --stage: var(--st-dft); } .col-wct { --stage: var(--st-wct); } .col-res { --stage: var(--st-res); }
    .column {
      position: relative; border-radius: 18px; min-width: 0;
      background: color-mix(in srgb, var(--stage) 5%, var(--surface-soft));
      border: 1px solid color-mix(in srgb, var(--stage) 16%, var(--border));
      box-shadow: var(--shadow-xs);
    }
    [data-theme="dark"] .column { background: color-mix(in srgb, var(--stage) 6%, var(--surface-soft)); }
    .column::before {
      content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 3px; border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg, var(--stage), color-mix(in srgb, var(--stage) 25%, transparent));
    }
    .col-header { display: flex; align-items: center; gap: 9px; padding: 14px 14px 10px; font-size: 13.5px; font-weight: 700; }
    .col-header::before { content: ""; flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--stage); box-shadow: 0 0 0 4px color-mix(in srgb, var(--stage) 18%, transparent); }
    .col-badge {
      margin-left: auto; min-width: 26px; text-align: center; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: color-mix(in srgb, var(--stage) 72%, var(--text)); background: color-mix(in srgb, var(--stage) 15%, var(--surface)); border: 1px solid color-mix(in srgb, var(--stage) 22%, transparent);
    }
    [data-theme="dark"] .col-badge { color: color-mix(in srgb, var(--stage) 55%, #fff); }
    .col-body { display: flex; flex-direction: column; gap: 10px; padding: 2px 10px 12px; max-height: calc(100vh - 330px); min-height: 120px; overflow-y: auto; scrollbar-width: thin; }
    .empty { padding: 26px 14px; border-radius: 14px; border: 1.5px dashed color-mix(in srgb, var(--stage, var(--primary)) 28%, var(--border)); color: var(--muted-light); font-size: 13px; font-weight: 500; text-align: center; }
    .more-btn { border: 1px dashed color-mix(in srgb, var(--stage) 40%, var(--border)); background: transparent; color: var(--muted); border-radius: 12px; padding: 9px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
    .more-btn:hover { background: color-mix(in srgb, var(--stage) 10%, transparent); color: var(--text); }

    .a-card {
      position: relative; cursor: pointer; text-align: left; width: 100%;
      background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); border-radius: 14px;
      padding: 11px 12px 10px; box-shadow: var(--shadow-xs); transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    }
    [data-theme="dark"] .a-card { background: color-mix(in srgb, var(--surface) 96%, #fff); }
    .a-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--stage, var(--primary)) 32%, var(--border)); box-shadow: 0 12px 28px color-mix(in srgb, var(--stage, var(--primary)) 16%, transparent), 0 2px 6px rgba(25, 22, 70, .06); }
    .a-card.p-High { border-left-color: #ef4444; } .a-card.p-Medium { border-left-color: #f59e0b; } .a-card.p-Low { border-left-color: #10b981; }
    .a-card.is-archived { opacity: .78; }
    .a-card.active { box-shadow: 0 0 0 2px var(--primary), var(--shadow); }
    .card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; }
    .ticket-no { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--surface-muted); border: 1px solid var(--border); white-space: nowrap; }
    .card-subject { font-size: 13.5px; font-weight: 650; line-height: 1.35; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .card-company { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-foot { display: flex; align-items: center; gap: 8px; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
    .card-foot .metric { display: inline-flex; gap: 4px; align-items: center; font-weight: 650; font-variant-numeric: tabular-nums; }
    .card-foot svg { width: 13px; height: 13px; }
    .card-foot .when { margin-left: auto; white-space: nowrap; }
    .card-people { display: flex; align-items: center; gap: 4px; }

    .tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 750; letter-spacing: .01em; white-space: nowrap; border: 1px solid transparent; font-family: inherit; }
    .tag.gray { background: var(--surface-muted); color: var(--muted); border-color: var(--border); }
    .tag.blue { background: var(--info-soft); color: var(--info); }
    .tag.violet { background: var(--purple-soft); color: var(--purple); }
    .tag.amber { background: var(--warning-soft); color: var(--warning); }
    .tag.red { background: var(--danger-soft); color: var(--danger); }
    .tag.recon { background: transparent; color: var(--muted); border: 1px dashed var(--border-strong); }
    .pb-High { color: #dc2626; } .pb-Medium { color: #b45309; } .pb-Low { color: #047857; }
    [data-theme="dark"] .pb-High { color: #fca5a5; } [data-theme="dark"] .pb-Medium { color: #fcd34d; } [data-theme="dark"] .pb-Low { color: #6ee7b7; }

    .avatar {
      display: inline-grid; place-items: center; flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%;
      background: var(--av, var(--muted-light)); color: #fff; font-size: 9.5px; font-weight: 800; letter-spacing: .02em;
      box-shadow: 0 0 0 2px var(--surface);
    }
    .avatar.sm { width: 20px; height: 20px; font-size: 8.5px; }
    .avatar.lg { width: 32px; height: 32px; font-size: 11px; }
    .avatar.none { background: var(--surface-muted); color: var(--muted-light); box-shadow: 0 0 0 1px var(--border) inset; }
    .avatar.cs { border-radius: 8px; }
    .stage-pill { --stage: var(--muted-light); display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: color-mix(in srgb, var(--stage) 75%, var(--text)); background: color-mix(in srgb, var(--stage) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--stage) 28%, transparent); white-space: nowrap; }
    .stage-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--stage); }
    .stage-pill.unknown { border-style: dashed; }
    .arrow { color: var(--muted-light); font-weight: 700; }

    /* ---- Activity stream ------------------------------------------------------ */
    .stream { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-xs); overflow: hidden; }
    .day-head { position: sticky; top: 59px; z-index: 2; padding: 9px 16px; font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: color-mix(in srgb, var(--surface-soft) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
    .s-row { display: grid; grid-template-columns: 62px 30px minmax(150px, 280px) 1fr auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .s-row:hover { background: var(--surface-soft); }
    .s-time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
    .s-ticket { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .s-ticket .subj { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-what { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
    .s-what .lbl { font-weight: 700; }
    .s-what .txt { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
    .s-who { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--text-soft); }
    .k-icon { --k: var(--k-other); width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--k); background: color-mix(in srgb, var(--k) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--k) 26%, transparent); }

    .loader { padding: 22px; text-align: center; color: var(--muted); font-size: 13px; }
    .spinner { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid color-mix(in srgb, var(--primary) 18%, transparent); border-top-color: var(--primary); animation: spin .8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- By agent ------------------------------------------------------------- */
    .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .agent-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-xs); overflow: hidden; }
    .agent-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, color-mix(in srgb, var(--av) 10%, var(--surface)), var(--surface)); }
    .agent-head b { font-size: 14px; }
    .agent-head .sub { font-size: 11.5px; color: var(--muted); }
    .agent-head .big { margin-left: auto; text-align: right; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .agent-head .big small { display: block; font-size: 10.5px; color: var(--muted-light); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .agent-list { max-height: 280px; overflow-y: auto; }
    .agent-t { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12.5px; }

    .section-title { font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 18px 2px 10px; }

    /* ---- Ticket drawer + timeline -------------------------------------------- */
    .scrim { position: fixed; inset: 0; background: rgba(9, 10, 22, .42); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 40; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(820px, 100vw);
