apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-kanban-mcp
  namespace: support-kanban
  labels:
    app: support-kanban-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 2
  minReadySeconds: 5
  selector:
    matchLabels:
      app: support-kanban-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: support-kanban-mcp
    spec:
      imagePullSecrets:
        - name: azurecr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          # PLACEHOLDER - Wajdi's Bamboo plan owns bumping this tag, same as
          # the support-kanban_code image.
          image: qtk8s.azurecr.io/support-kanban-mcp_code:REPLACE_ME
          imagePullPolicy: Always
          ports:
            - containerPort: 3100
          envFrom:
            - configMapRef:
                name: support-kanban-mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
